[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.mypy]
python_version = 3.10
show_error_context = true
pretty = true
show_column_numbers = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = ['docs/']

[[tool.mypy.overrides]]
module = ["gevent.*", "mock.*", "pytest.*", "volttron.*", "interoperability.*"]
ignore_missing_imports = true

[tool.poetry]
name = "volttron-device-adapter"
version = "2.0.0rc0"
description = "The VOLTTRON Device Adapter Agent bridges one device into another across protocols."
authors = ["The VOLTTRON Development Team <volttron@pnnl.gov>"]
license = "Apache License 2.0"
readme = "README.md"
repository = "https://github.com/eclipse-volttron/volttron-device-adapter"
homepage = "https://github.com/eclipse-volttron/volttron-device-adapter"
keywords = []
packages = [ { include = "device_adapter", from = "src" } ]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: Apache Software License"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
volttron-core = ">=2.0.0rc30"
pydantic = "^2.0"
# TODO: interoperability-service (provides interoperability.transform_parser) is not yet published.
#  It must be installed alongside this agent, e.g. from ../interoperability_service.

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
mock = "^4.0.3"
pre-commit = "^2.17.0"
yapf = "^0.32.0"
toml = "^0.10.2"
mypy = "^0.942"
isort = "^5.10.1"

[tool.poetry.scripts]
volttron-device-adapter = "device_adapter.agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 99
split_before_logical_operator = true
